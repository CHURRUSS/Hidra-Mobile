name: Atualizar notícias HIDRA
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: hidra-news
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Buscar RSS e atualizar JSON
        run: python scripts/atualizar_noticias.py
      - name: Publicar notícias no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/noticias.json
          if ! git diff --cached --quiet; then
            git commit -m "Atualizar notícias HIDRA"
            git push
          fi
